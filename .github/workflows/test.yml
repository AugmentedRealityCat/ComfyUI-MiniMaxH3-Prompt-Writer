name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r standalone/requirements.txt

      - name: Install DOM test dependency
        run: npm ci --ignore-scripts

      # unittest includes the local Node frontend wrapper; do not run it twice.
      - name: Run Python and frontend tests
        env:
          PYTHONPATH: tests/ci_stubs
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Standalone tests
        env:
          PYTHONPATH: standalone:standalone/h3_standalone/compat:.
        run: python -m unittest discover -s standalone/tests -p "test_*.py"

      - name: Run Standalone frontend tests
        run: node --test standalone/tests/frontend.mjs
